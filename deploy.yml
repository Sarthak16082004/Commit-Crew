name: CI/CD — NexDev Portfolio

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Validate (runs on ALL branches)
  # ─────────────────────────────────────────
  validate:
    name: 🔍 Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dev dependencies
        run: npm ci

      - name: 🔍 Lint HTML
        run: npx htmlhint "**/*.html" --config .htmlhintrc

      - name: 🎨 Lint CSS
        run: npx stylelint "css/**/*.css" --config .stylelintrc

      - name: ✅ All checks passed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ HTML validation: PASSED"
          echo "✅ CSS linting:     PASSED"
          echo "🚀 Ready for review / deploy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ─────────────────────────────────────────
  # JOB 2: Deploy (runs ONLY on main merge)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 🌐 Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Success
        run: echo "Deployed → ${{ steps.deployment.outputs.page_url }}"
